# Run through scripts/work_coordination_ui_fixture.py. It builds the selected
# candidate and copies this manifest into a fresh disposable fixture directory,
# adding only that server's synthetic browser storage state. No Cairn response
# is mocked. Direct UIPass use requires --base-url for that disposable server.
schema_version: 1
viewports:
  desktop: {width: 1440, height: 1000}
  phone: {width: 390, height: 844}
timeouts: {build: 300, startup: 30, case: 25, total: 180}
surfaces:
  login:
    states:
      terminal_code: {route: /, ready: '#login-form'}
  workflow:
    states:
      selected_item:
        route: /
        ready: '#detail-modal'
        actions:
          - {type: click, selector: '.work-card >> nth=0'}
  dense:
    states:
      long_untrusted_titles: {route: /, ready: '.work-card >> nth=0'}
  empty:
    states:
      no_items: {route: /, ready: '.board-container'}
  empty_failed:
    states:
      retained_failure: {route: /, ready: '#refresh-error'}
  stale:
    states:
      failed_refresh: {route: /, ready: '.work-card >> nth=0'}
  auth_rejected:
    states:
      hidden_external_fields: {route: /, ready: '#auth-alert'}
  unavailable:
    states:
      forgotten_request:
        route: /
        ready: '#detail-modal'
        actions:
          - {type: click, selector: '.work-card >> nth=0'}
  typed:
    states:
      linked_target_states:
        route: /
        ready: '#detail-modal'
        actions:
          - {type: click, selector: '.work-card >> nth=0'}
  artifact_workflow:
    states:
      selected_item:
        route: /
        ready: '#artifact-link-submit'
        actions:
          - {type: click, selector: '.work-card >> nth=0'}
          - {type: click, selector: '#artifact-link-revision'}
      exact_revision:
        route: /
        ready: '#artifact-revision-section'
      link_history:
        route: /
        ready: '#artifact-history-section'
        actions:
          - {type: click, selector: '.work-card >> nth=0'}
          - {type: click, selector: '.artifact-history-btn >> nth=0'}
  artifact_empty:
    states:
      no_links:
        route: /
        ready: '#item-artifacts-empty'
        actions:
          - {type: click, selector: '.work-card >> nth=0'}
          - {type: click, selector: '#artifact-link-revision'}
  artifact_unavailable:
    states:
      retained_unavailable:
        route: /
        ready: '#artifact-revision-section'
  artifact_disabled:
    states:
      retained_links:
        route: /
        ready: '#artifact-admission'
        actions:
          - {type: click, selector: '.work-card >> nth=0'}
          - {type: click, selector: '#artifact-link-revision'}
  artifact_races:
    states:
      unaffected_revision:
        route: /
        ready: '#artifact-revision-section'
