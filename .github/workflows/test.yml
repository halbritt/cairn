name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: cairn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAIRN_TEST_DATABASE_URL: postgres://cairn:fixture-only@localhost:5432/cairn_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # Packages share this service database; keep their unrelated writers apart.
      # Concurrency exercised explicitly inside each package remains enabled.
      - run: go test -race -count=1 -p 1 ./...
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: make check build
      - run: CAIRN_DATABASE_URL="$CAIRN_TEST_DATABASE_URL" python3 scripts/check_use_report.py bin/cairn
      - name: Check authenticated CLI and compact startup
        run: CAIRN_DATABASE_URL="$CAIRN_TEST_DATABASE_URL" python3 scripts/check-local-api.py "$PWD/bin/cairn" "$RUNNER_TEMP/cairn-api-check"
