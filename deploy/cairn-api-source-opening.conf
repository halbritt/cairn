# Systemd user drop-in template for CAIRN_SOURCE_OPENING_BINDING
# Install at: ~/.config/systemd/user/cairn-api.service.d/60-source-opening-binding.conf
#
# PRECONDITIONS (verify before enabling):
#   1. Upgrade cairn-api, all local CLI/hook/MCP clients, and any remote relays
#      for every listed principal to a build with source_opening support
#      (check `cairn clients` and `cairn_client_info`). Un-upgraded readers get
#      426 PROTOCOL_UNSUPPORTED on bound partial pulls.
#   2. List exact configured principals from ~/.local/share/cairn/identities.json
#      (comma-separated, no whitespace around commas). Unconfigured principals
#      cause `cairn serve` to refuse startup.
#
# IRREVERSIBLE BINARY DOWNGRADE WARNING:
#   Once any context-index receipt is bound (`span_context` sealed in
#   semantic_body), downgrading `cairn` to a pre-feature binary causes
#   INTEGRITY_FAILURE / STALE_PACKAGE on retained bound receipts indefinitely.
#   Disabling CAIRN_SOURCE_OPENING_BINDING only stops NEW receipts from binding.
#
# OFF SWITCH:
#   Set CAIRN_SOURCE_OPENING_BINDING="" (or remove this drop-in), then run:
#   systemctl --user daemon-reload && systemctl --user restart cairn-api.service

[Service]
# Environment="CAIRN_SOURCE_OPENING_BINDING=agent:cairn-local,observer:cairn-local,agent:cairn-hosted,observer:cairn-hosted"
